name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: 语法检查 + 非硬件自检 (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pc/requirements.txt

      - name: 编译检查
        run: python -m compileall -q pc tools

      - name: 示例 ini 必须能全部解析
        working-directory: pc
        run: |
          python -c "import remote_ui as R; d,b=R.read_ini('../remotekey.sample.ini'); print(len(d),'条 OK'); assert not b, b"

      - name: 内置动作表必须双向自洽
        working-directory: pc
        run: |
          python -c "import remote_ui as R; bad=[k for k,v in R.DEFAULT_ACTIONS.items() if R.parse_action(v) is None]; print(len(R.DEFAULT_ACTIONS),'条动作'); assert not bad, bad"

  firmware:
    name: 固件结构检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 花括号配平 / Arduino 入口存在
        run: |
          python3 -c 's=open("firmware/cmcc_s3_bridge/cmcc_s3_bridge.ino",encoding="utf-8").read();assert s.count("{")==s.count("}"),"braces";assert "setup()" in s and "loop()" in s,"entry";print("OK",s.count(chr(10)),"lines")'
